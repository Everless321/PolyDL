syntax = "proto3";

package douyin;

// ============================================================================
// Douyin (抖音) live danmaku — core protobuf definitions
//
// Extracted from f2 @ 1d9f3747610d09c0a32122f2ffefa2b4bc56f011
//   f2/apps/douyin/proto/douyin_webcast_pb2.py  (serialized FileDescriptorProto)
//
// Field numbers/types are taken verbatim from f2's compiled descriptor, so they
// are byte-accurate for decoding. Only the SUBSET needed to pull chat / gift /
// like / enter / follow / online-count / room-stats out of the WSS stream is
// kept. Two giant messages (User, GiftStruct) are TRIMMED to decode-relevant
// fields — dropped fields simply arrive as unknown fields and are skipped
// harmlessly by any proto3 decoder. Non-essential referenced sub-messages are
// emitted as empty stubs at the bottom (their bytes are skipped on decode).
//
// Decoding flow:
//   WSS binary frame -> PushFrame
//   PushFrame.payload (gzip) -> inflate -> Response
//   Response.messages[i] -> Message (envelope: method + payload bytes)
//   Message.payload -> decode as the concrete *Message keyed by Message.method
//                      (e.g. "WebcastChatMessage" -> ChatMessage)
// ============================================================================


// --- f2: PushFrame — outer WSS frame ---------------------------------------
message PushFrame {
  int64 seqId = 1;
  int64 logId = 2;
  int64 service = 3;
  int64 method = 4;
  repeated HeadersList headersList = 5;   // headers carry e.g. "compress_type":"gzip"
  string payloadEncoding = 6;
  string payloadType = 7;                 // "msg" for normal push
  bytes payload = 8;                      // gzip-compressed serialized Response
  string LodIDNew = 9;
}

// --- f2: Response — gzip-inflated outer container ---------------------------
message Response {
  repeated Message messages = 1;
  string cursor = 2;
  int64 fetch_interval = 3;
  int64 now = 4;
  string internal_ext = 5;                // echoed back as ack cursor
  int32 fetch_type = 6;
  map<string, string> routeParams = 7;
  int64 heartbeat_duration = 8;
  bool need_ack = 9;
  string push_server = 10;
  string live_cursor = 11;
  bool history_no_more = 12;
  string proxy_server = 13;
}

// --- f2: Message — per-message envelope inside Response ---------------------
message Message {
  string method = 1;      // e.g. "WebcastChatMessage", "WebcastGiftMessage"
  bytes payload = 2;      // serialized concrete message, decode by `method`
  int64 msg_id = 3;
  int32 msg_type = 4;
  int64 offset = 5;
  bool need_wrds_store = 6;
  int64 wrds_version = 7;
  string wrds_sub_key = 8;
}

// --- f2: Common — shared header embedded in every concrete message ----------
message Common {
  string method = 1;
  int64 msg_id = 2;
  int64 room_id = 3;
  int64 create_time = 4;
  int32 monitor = 5;
  bool is_show_msg = 6;
  string describe = 7;
  Text display_text = 8;
  int64 fold_type = 9;
  int64 anchor_fold_type = 10;
  int64 priority_score = 11;
  string log_id = 12;
  string msg_process_filter_k = 13;
  string msg_process_filter_v = 14;
  User user = 15;
  Room room = 16;                         // stubbed (empty) — not needed for danmaku
  int64 anchor_fold_type_v2 = 17;
  int64 process_at_sei_time_ms = 18;
  int64 random_dispatch_ms = 19;
  bool is_dispatch = 20;
  int64 channel_id = 21;
  int64 diff_sei2abs_second = 22;
  int64 anchor_fold_duration = 23;
  int64 app_id = 24;
}

// --- f2: User — TRIMMED to decode-relevant identity/avatar fields ----------
// (f2's full User has ~120 fields incl. a 1001+ block; dropped ones are skipped)
message User {
  string id = 1;
  string short_id = 2;
  string nickname = 3;
  int32 gender = 4;
  string signature = 5;
  int32 level = 6;
  Image avatar_thumb = 9;
  Image avatar_medium = 10;
  Image avatar_large = 11;
  bool verified = 12;
  string city = 14;
  repeated Image badge_image_list = 21;
  FollowInfo follow_info = 22;
  PayGrade pay_grade = 23;
  FansClub fans_club = 24;                 // stubbed
  string display_id = 38;
  AnchorLevel webcast_anchor_level = 42;   // stubbed
  string sec_uid = 46;
  string web_rid = 67;
  string id_str = 1028;                     // string form of numeric id
  bool is_follower = 1029;
  bool is_following = 1030;
  string fan_ticket_count = 1022;
}

// --- f2: Text — rich text container (display_text / rtf_content) ------------
message Text {
  string key = 1;
  string default_pattern = 2;              // template with {0},{1}... placeholders
  TextFormat default_format = 3;           // stubbed
  repeated TextPiece pieces = 4;           // fill the placeholders in order
  map<string, SchemaInfo> schema_infos = 20;
}

// --- f2: TextPiece — one span inside a Text --------------------------------
message TextPiece {
  int32 type = 1;
  TextFormat format = 2;                    // stubbed
  string value_ref = 3;
  string string_value = 11;                 // plain text
  TextPieceUser user_value = 21;            // stubbed
  TextPieceGift gift_value = 22;            // stubbed
  TextPieceHeart heart_value = 23;          // stubbed
  TextPiecePatternRef pattern_ref_value = 24; // stubbed
  TextPieceImage image_value = 25;          // stubbed
  string schema_key = 100;
}

// --- f2: ChatMessage — "WebcastChatMessage" (弹幕文本) ----------------------
message ChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;                       // <-- the danmaku text
  bool visible_to_sender = 4;
  Image background_image = 5;
  string full_screen_text_color = 6;
  Image background_image_v2 = 7;
  PublicAreaCommon public_area_common = 9;  // stubbed
  Image gift_image = 10;
  int64 agree_msg_id = 11;
  int32 priority_level = 12;
  LandscapeAreaCommon landscape_area_common = 13; // stubbed
  int64 event_time = 15;
  bool send_review = 16;
  bool from_intercom = 17;
  bool intercom_hide_user_card = 18;
  repeated int32 chat_tags = 19;
  int64 chat_by = 20;
  int32 individual_chat_priority = 21;
  Text rtf_content = 40;
  Text rtf_content_v2 = 41;
}

// --- f2: GiftMessage — "WebcastGiftMessage" (礼物) --------------------------
message GiftMessage {
  Common common = 1;
  int64 gift_id = 2;                        // <-- gift id (also GiftStruct.id)
  int64 fan_ticket_count = 3;
  int64 group_count = 4;
  int64 repeat_count = 5;
  int64 combo_count = 6;                    // <-- combo (连击) count
  User user = 7;                            // <-- sender
  User to_user = 8;
  int32 repeat_end = 9;
  TextEffect text_effect = 10;              // stubbed
  int64 group_id = 11;
  int64 income_taskgifts = 12;
  int64 room_fan_ticket_count = 13;
  GiftIMPriority priority = 14;             // stubbed
  GiftStruct gift = 15;                     // <-- gift detail (name/icon/diamonds)
  string log_id = 16;
  int64 send_type = 17;
  PublicAreaCommon public_area_common = 18; // stubbed
  Text tray_display_text = 19;
  int64 banned_display_effects = 20;
  GiftTrayInfo tray_info = 21;              // stubbed
  AssetEffectMixInfo asset_effect_mix_info = 22; // stubbed
  bool display_for_self = 25;
  string interact_gift_info = 26;
  string diy_item_info = 27;
  repeated int64 min_asset_set = 28;
  int64 total_count = 29;                   // <-- total gift count this stream
  int32 client_gift_source = 30;
  AnchorGiftData anchor_gift = 31;          // stubbed
  repeated int64 to_user_ids = 32;
  int64 send_time = 33;
  int64 force_display_effects = 34;
  string trace_id = 35;
  int64 effect_display_ts = 36;
  SendTogether send_together = 37;          // stubbed
  ExtraEffect extra_effect = 38;            // stubbed
  RoomHotInfo room_hot_info = 39;           // stubbed
  string GiftPlayParam = 40;
  int32 multi_send_effect_level = 41;
  SeriesPlayGift series_gift_data = 42;     // stubbed
}

// --- f2: LikeMessage — "WebcastLikeMessage" (点赞) --------------------------
message LikeMessage {
  Common common = 1;
  int64 count = 2;                          // <-- likes in this batch
  int64 total = 3;                          // <-- cumulative likes
  int64 color = 4;
  User user = 5;
  string icon = 6;
  DoubleLikeDetail double_like_detail = 7;  // stubbed
  DisplayControlInfo display_control_info = 8; // stubbed
  int64 linkmic_guest_uid = 9;
  string scene = 10;
  PicoDisplayInfo pico_display_info = 11;   // stubbed
  PublicAreaCommon public_area_common = 12; // stubbed
}

// --- f2: MemberMessage — "WebcastMemberMessage" (进场) ----------------------
// TRIMMED: f2's full MemberMessage carries large nested EffectConfig/map blocks
// (enter effects) omitted here; the identity + count fields are kept.
message MemberMessage {
  Common common = 1;
  User user = 2;
  string member_count = 3;                  // <-- current audience count (string)
  User operator = 4;
  bool is_set_to_admin = 5;
  bool is_top_user = 6;
  string rank_score = 7;
  string top_user_no = 8;
  string enter_type = 9;
  string action = 10;
  string action_description = 11;
  string user_id = 12;
  string pop_str = 14;
  Text anchor_display_text = 18;            // "xxx 来了" rendered text
  PublicAreaCommon public_area_common = 19; // stubbed
  string user_enter_tip_type = 20;
  string anchor_enter_tip_type = 21;
  // dropped from f2: effect_config(13), enter_effect_config(15),
  //   background_image(16), background_image_v2(17),
  //   buried_point(22 map), alternative_effect_config(23 map),
  //   pico_enter_effect_config(24)
}

// --- f2: SocialMessage — "WebcastSocialMessage" (关注/分享) -----------------
message SocialMessage {
  Common common = 1;
  User user = 2;
  int64 share_type = 3;
  int64 action = 4;                         // 1 = follow (关注)
  string share_target = 5;
  int64 follow_count = 6;                   // <-- anchor follower count
  PublicAreaCommon public_area_common = 7;  // stubbed
}

// --- f2: RoomUserSeqMessage — "WebcastRoomUserSeqMessage" (在线观众) --------
message RoomUserSeqMessage {
  Common common = 1;
  repeated Contributor ranks = 2;
  int64 total = 3;                          // <-- total online-ish
  string pop_str = 4;
  repeated Contributor seats = 5;
  int64 popularity = 6;
  int64 total_user = 7;                     // <-- cumulative viewers
  string total_user_str = 8;
  string total_str = 9;
  string online_user_for_anchor = 10;
  string total_pv_for_anchor = 11;
  string up_right_stats_str = 12;
  string up_right_stats_str_complete = 13;

  message Contributor {
    int64 score = 1;
    User user = 2;
    int64 rank = 3;
    int64 delta = 4;
    bool is_hidden = 5;
    string score_description = 6;
    string exactly_score = 7;
  }
}

// --- f2: RoomStatsMessage — "WebcastRoomStatsMessage" (房间统计) ------------
message RoomStatsMessage {
  Common common = 1;
  string display_short = 2;
  string display_middle = 3;
  string display_long = 4;                  // <-- "xxx人观看" human string
  int64 display_value = 5;
  int64 display_version = 6;
  bool incremental = 7;
  bool is_hidden = 8;
  int64 total = 9;                          // <-- total viewers
  int64 display_type = 10;
}

// --- ControlMessage — "WebcastControlMessage" (直播结束判断) ----------------
// NOTE: NOT present in f2's douyin_webcast proto (f2 does not decode it).
// This is the well-known douyin schema used across danmaku clients:
//   status == 3 (and often action fields) => live ended.
// TODO 未确认: verify against real traffic; only common+status are relied upon.
message ControlMessage {
  Common common = 1;
  int64 status = 2;                         // 3 = 直播结束 (live ended)
}

// --- f2: Image — avatar / badge / icon image -------------------------------
message Image {
  repeated string urlList = 1;              // <-- CDN urls
  string uri = 2;
  int64 height = 3;
  int64 width = 4;
  string avg_color = 5;
  int32 image_type = 6;
  string open_web_url = 7;
  ImageContent content = 8;                 // stubbed
  bool is_animated = 9;
  NinePatchSetting flex_setting_list = 10;  // stubbed
  NinePatchSetting text_setting_list = 11;  // stubbed
}

// --- f2: GiftStruct — TRIMMED to gift identity fields ----------------------
// (f2's full GiftStruct has ~76 fields; dropped ones are skipped on decode)
message GiftStruct {
  Image image = 1;
  string describe = 2;
  bool notify = 3;
  int64 duration = 4;
  int64 id = 5;                             // <-- gift id
  bool combo = 10;
  int32 type = 11;
  int32 diamond_count = 12;                 // <-- price in diamonds
  string name = 16;                         // <-- gift name (礼物名)
  Image icon = 21;
}

// --- f2: FollowInfo (kept — small, useful) ---------------------------------
message FollowInfo {
  string following_count = 1;
  string follower_count = 2;
  string follow_status = 3;
  string push_status = 4;
  string remark_name = 5;
  string follower_count_str = 6;
  string following_count_str = 7;
  bool invalid_follow_status = 8;
}

// --- f2: PayGrade (kept — small, user grade) -------------------------------
message PayGrade {
  string total_diamond_count = 1;
  Image diamond_icon = 2;
  string name = 3;
  Image icon = 4;
  string next_name = 5;
}

